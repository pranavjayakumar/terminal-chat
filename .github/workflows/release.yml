name: release
on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

# The workflow only builds and creates a DRAFT release. A maintainer then
# signs checksums.txt with their own SSH key and publishes it:
#   make release-sign TAG=vX.Y.Z KEY=~/.ssh/id_ed25519
# so a compromised workflow or token can't ship a release tc will install.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the ancestry check needs origin/main
          persist-credentials: false # tests and builds run without the token
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false # a poisoned module/build cache must not reach a release

      - name: Check the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Plain vX.Y.Z only: no prereleases (they'd become "latest").
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $TAG is not vX.Y.Z" >&2
            exit 1
          fi
          # Only commits already merged to main are released.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $TAG ($GITHUB_SHA) is not on origin/main" >&2
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="tc_${os}_${arch}"
            mkdir -p "build/$name"
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "build/$name/tc" ./cmd/tc
            {
              echo "tc $TAG for $os/$arch — terminal team chat"
              echo
              echo "Put tc on your PATH (e.g. ~/.local/bin), then join with the invite you were sent:"
              echo "  tc join 'tc://host:7443/…'"
              echo
              echo "https://github.com/pranavjayakumar/terminal-chat"
            } > "build/$name/README.txt"
            tar -C "build/$name" -czf "dist/$name.tar.gz" tc README.txt
          done
          ls -l dist

      - name: Smoke test the linux/amd64 build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir smoke && tar -C smoke -xzf dist/tc_linux_amd64.tar.gz
          ./smoke/tc version | grep -F "$TAG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-default
          path: dist/
          if-no-files-found: error

  # The voice flavor (docs/VOICE.md): cgo, -tags voice, libopus built from a
  # pinned xiph.org tarball and linked statically (scripts/build-voice.sh).
  # Native runners: cgo doesn't cross-compile to Linux arm64 here, and the
  # macOS runner builds both arches with clang -arch. ubuntu-22.04 keeps the
  # glibc floor at 2.35.
  voice:
    needs: build # only for a tag that passed the checks above
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            targets: darwin/arm64 darwin/amd64
          - runner: ubuntu-22.04
            targets: linux/amd64
          - runner: ubuntu-22.04-arm
            targets: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false

      - name: Build tools
        run: |
          set -eu
          if [ "$(uname -s)" = Darwin ]; then
            command -v pkg-config >/dev/null || brew install pkgconf
          else
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends pkg-config build-essential
          fi

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -eu
          for target in $TARGETS; do
            sh scripts/build-voice.sh "${target%/*}" "${target#*/}" "$TAG" dist
          done

      - name: Smoke test
        env:
          TAG: ${{ github.ref_name }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -eu
          for target in $TARGETS; do
            name="tc-voice_${target%/*}_${target#*/}"
            mkdir -p "smoke/$name" && tar -C "smoke/$name" -xzf "dist/$name.tar.gz"
            case "$target" in
            darwin/amd64)
              if arch -x86_64 /usr/bin/true 2>/dev/null; then
                arch -x86_64 "./smoke/$name/tc" version | grep -F "$TAG (voice)"
              else
                file "./smoke/$name/tc" | grep -F x86_64
              fi ;;
            *) "./smoke/$name/tc" version | grep -F "$TAG (voice)" ;;
            esac
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-voice-${{ matrix.runner }}
          path: dist/
          if-no-files-found: error

  # One checksums.txt over every tarball, so the maintainer's SSHSIG
  # signature (make release-sign) covers the voice builds too. Its first
  # line, "version <tag>", binds the signature to this tag: tc update and
  # install.sh refuse a signed checksums.txt republished under another tag.
  sums:
    needs: [build, voice]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          cd dist
          n=0
          for f in tc_darwin_amd64 tc_darwin_arm64 tc_linux_amd64 tc_linux_arm64 \
            tc-voice_darwin_amd64 tc-voice_darwin_arm64 tc-voice_linux_amd64 tc-voice_linux_arm64; do
            test -f "$f.tar.gz" || { echo "missing $f.tar.gz" >&2; exit 1; }
            n=$((n + 1))
          done
          test "$(ls -- *.tar.gz | wc -l)" -eq "$n" || { ls -l; echo "unexpected files" >&2; exit 1; }
          { echo "version $TAG"; sha256sum -- *.tar.gz; } > checksums.txt
          awk '$1 != "version"' checksums.txt | sha256sum -c -
          cat checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build, voice, sums, attest]
    runs-on: ubuntu-latest
    environment: release # add required reviewers in the repo settings
    permissions:
      contents: write # create the draft release and upload assets
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --generate-notes

  # Build provenance (Sigstore, via GitHub's OIDC token) for every tarball:
  # make release-sign runs gh attestation verify on each one (this workflow,
  # refs/tags/<tag>, the tag's commit) before signing, so tarballs swapped
  # in the draft by anyone with release-write access are never signed. The
  # only job with id-token/attestations write; its token can't touch contents.
  attest:
    needs: sums
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Check checksums
        run: |
          set -eu
          cd dist
          awk '$1 != "version"' checksums.txt | sha256sum -c -
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
