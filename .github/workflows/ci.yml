name: ci
# The repo is private: macOS minutes bill at 10x, so macOS runs only on main.
# Branch pushes are covered by their pull_request run, not a second push run.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "Formula/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "Formula/**", "LICENSE"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - run: test -z "$(gofmt -l ./cmd ./internal)" || (gofmt -l ./cmd ./internal; exit 1)
      - run: go vet ./...
      - run: go vet -tags tctamper ./...
      - run: go test -race ./...
      - run: go test -race -tags tctamper ./internal/e2e
      - run: make build && ls -lh bin/tc
  # Voice flavor (docs/VOICE.md): cgo + libopus, -tags voice. The default
  # job above stays CGO_ENABLED=0.
  voice:
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - name: libopus
        run: |
          if [ "$(uname -s)" = Darwin ]; then
            brew install opus pkgconf
          else
            sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libopus-dev pkg-config
          fi
      - run: go vet -tags voice ./...
        env: { CGO_ENABLED: "1" }
      - run: go build -tags voice ./...
        env: { CGO_ENABLED: "1" }
      - run: go test -race -tags voice ./internal/voice/ ./internal/client/ ./internal/tui/ ./internal/e2e/ ./cmd/tc/
        env: { CGO_ENABLED: "1" }
      # The release packaging path (static libopus from source), for this
      # runner's OS/arch, so release.yml's voice job is exercised on every PR.
      - name: Release build (static libopus)
        run: |
          set -eu
          arch=$(go env GOARCH)
          os=$(go env GOOS)
          sh scripts/build-voice.sh "$os" "$arch" v0.0.0-ci dist
          mkdir smoke && tar -C smoke -xzf "dist/tc-voice_${os}_${arch}.tar.gz"
          ./smoke/tc version | grep -F "v0.0.0-ci (voice)"
          ls -l smoke/tc
